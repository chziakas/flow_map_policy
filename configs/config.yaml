# ─── Environment ───
env:
  env_name: "cube-triple-play-singletask-task4-v0"
  horizon_length: 5
  sparse: false

# ─── Training Pipeline ───
training:
  seed: 0
  gpu: "0"
  offline_steps: 1000000
  online_steps: 1000000
  buffer_size: 2000000
  start_training: 5000
  utd_ratio: 1
  discount: 0.99
  fmq_online: true

# ─── Logging & Saving ───
logging:
  wandb_project: "fmq"
  run_group: "default"
  exp_suffix: ""
  save_dir: "exp/"
  log_interval: 5000
  eval_interval: 100000
  save_interval: -1

# ─── Evaluation ───
evaluation:
  eval_episodes: 50
  video_episodes: 0
  video_frame_skip: 3

# ─── Dataset ───
dataset:
  dataset_proportion: 1.0
  dataset_replace_interval: 1000
  ogbench_dataset_dir: null

# ─── Model Architecture ───
model:
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  num_qs: 2
  q_agg: "mean"
  encoder: null
  use_fourier_features: true
  fourier_feature_dim: 64
  weight_decay: 0.0
  action_chunking: true

# ─── Flow Map Pre-training (§3.1–3.2) ───
flow_map:
  flow_map_steps: 1
  flow_map_warmup_steps: 5000
  flow_map_anneal_end_step: 50000
  distillation_type: "mf"           # 'mf' (ESD), 'lsd' (Lagrangian), 'psd' (Progressive)

# ─── Optimizer ───
optimizer:
  lr: 0.0003
  batch_size: 256

# ─── FMQ Trust-Region Online Adaptation (§3.3) ───
fmq:
  fmq_alpha: 1.0                    # η = σ²/(2α)
  fmq_sigma_sq: 1.0                 # σ² in η computation
  fmq_normalize_grad: true          # ∇Q/‖∇Q‖ (Theorem 1)
  fmq_eta_override: -1.0            # override computed η if >= 0
  fmq_grad_at_online: false         # ∇Q at a₁^off (default) vs a₁^on
  fmq_adaptive_eta: true            # η_eff via critic disagreement (Eq. 13)
  fmq_beta: 0.3                     # β: critic disagreement sensitivity

# ─── Inference Action Selection ───
inference:
  actor_type: "best-of-n"           # 'best-of-n' or 'qgbs'
  actor_num_samples: 32             # M: beam width / initial candidates

# ─── QGBS: Q-Guided Beam Search (Algorithm 2, §3.4) ───
# To use: set inference.actor_type to "qgbs" and adjust below.
qgbs:
  actor_num_samples: 4              # M: beam width (particles retained per step)
  qgbs_K: 1                         # K: beam search iterations
  qgbs_B: 4                         # B: branches per particle (re-noise copies)
  qgbs_eta: 0.3                     # η: trust-region step size
  qgbs_snr: 1.5                     # ρ: SNR → t' = ρ/(1+ρ)
