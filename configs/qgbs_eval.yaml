# ─── QGBS Evaluation Config ───
# Usage: python main.py --config configs/qgbs_eval.yaml \
#   --eval_only --fmq_online \
#   --restore_path=checkpoints/ctrp4/params_online_sd000.pkl \
#   --env_name=cube-triple-play-singletask-task4-v0 --seed=0

# ─── Environment ───
env:
  env_name: "cube-triple-play-singletask-task4-v0"
  horizon_length: 5
  sparse: false

# ─── Training Pipeline ───
training:
  seed: 0
  gpu: "0"
  fmq_online: true

# ─── Evaluation ───
evaluation:
  eval_episodes: 50
  video_episodes: 0

# ─── Model Architecture (must match the checkpoint) ───
model:
  actor_hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: true
  actor_layer_norm: false
  num_qs: 2
  q_agg: "mean"
  encoder: null
  use_fourier_features: true
  fourier_feature_dim: 64
  action_chunking: true

# ─── Inference Action Selection ───
inference:
  actor_type: "qgbs"
  actor_num_samples: 4              # M: beam width

# ─── QGBS: Q-Guided Beam Search (Algorithm 2, §3.4) ───
qgbs:
  actor_num_samples: 4              # M: beam width (particles retained per step)
  qgbs_K: 1                         # K: beam search iterations
  qgbs_B: 4                         # B: branches per particle (re-noise copies)
  qgbs_eta: 0.3                     # η: trust-region step size
  qgbs_snr: 1.5                     # ρ: SNR → t' = ρ/(1+ρ)
